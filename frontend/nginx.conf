# Configuração do nginx para servir o build estático do frontend (SPA).
# Substitui o default.conf do pacote Alpine (que retorna 404 para tudo) —
# ver frontend/Dockerfile e frontend/entrypoint.sh.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Fallback para index.html nas rotas client-side da SPA.
        try_files $uri $uri/ /index.html;
    }
}
