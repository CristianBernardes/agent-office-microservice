services:

  mosquitto:
    container_name: agent-office-microservice-mosquitto
    image: eclipse-mosquitto
    restart: unless-stopped
    ports:
      - "7083:1883"
      - "7000:3000"
    volumes:
      - ./ops/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - agent-office-microservice
  
  postgres:
    # pgvector/pgvector:pg16 já embute a extensão vetorial usada pela memória
    # semântica dos agentes nas fases seguintes do plano de migração — ver
    # docs/adr/006-postgresql-com-pgvector.md.
    image: pgvector/pgvector:pg16
    container_name: agent-office-microservice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agm
      POSTGRES_USER: agm
      POSTGRES_PASSWORD: agm
    ports:
      - "7034:5432"
    volumes:
      - ./.docker/pgdata:/var/lib/postgresql/data
      - ./ops/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agm -d agm"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agent-office-microservice

  # ─── Backend (Python 3.12 + FastAPI) ─────────────────────────────────────
  # O Ollama NUNCA é declarado neste arquivo — ver
  # docs/adr/009-ollama-externo-ao-docker-compose.md. OLLAMA_BASE_URL vem de
  # backend/.env e deve apontar para o host (ex.: http://172.17.0.1:11434 em
  # Linux), nunca para um serviço deste Compose.
  backend:
    container_name: agent-office-microservice-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://agm:agm@postgres:5432/agm
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      # Dentro do container, "localhost" aponta para o próprio container, não
      # para o host — por isso o IP da bridge padrão do Docker é usado para
      # alcançar o Ollama rodando no host. O Ollama continua SEMPRE externo a
      # este Compose (ver docs/adr/009-ollama-externo-ao-docker-compose.md).
      OLLAMA_BASE_URL: http://172.17.0.1:11434
    ports:
      - "7001:8000"
    volumes:
      - ./workspace:/app/workspace
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agent-office-microservice

networks:
  agent-office-microservice:
    driver: bridge
